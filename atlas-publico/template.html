<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Atlas de Pereira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
__LEAFLET_CSS__
</style>
<style>
:root {
  --bg: #f2f3ec;
  --bg-map: #eceee3;
  --surface: #ffffff;
  --surface-2: #e8e9df;
  --ink: #1c2620;
  --ink-soft: #55624f;
  --ink-faint: #8a927f;
  --line: #d7dbc9;
  --accent: #a86a2a;
  --accent-strong: #874f1c;
  --accent-ink: #fffaf2;
  --forest: #2f5d45;
  --forest-ink: #eef3ec;
  --shadow: 0 8px 30px rgba(28, 38, 32, 0.16);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12180f;
    --bg-map: #171f14;
    --surface: #1c2418;
    --surface-2: #232c1e;
    --ink: #eef1e6;
    --ink-soft: #aab5a0;
    --ink-faint: #6f7a68;
    --line: #2e3a28;
    --accent: #dda05a;
    --accent-strong: #f0b877;
    --accent-ink: #201203;
    --forest: #4c8a68;
    --forest-ink: #0e1a12;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
}

:root[data-theme="dark"] {
  --bg: #12180f;
  --bg-map: #171f14;
  --surface: #1c2418;
  --surface-2: #232c1e;
  --ink: #eef1e6;
  --ink-soft: #aab5a0;
  --ink-faint: #6f7a68;
  --line: #2e3a28;
  --accent: #dda05a;
  --accent-strong: #f0b877;
  --accent-ink: #201203;
  --forest: #4c8a68;
  --forest-ink: #0e1a12;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Manrope", -apple-system, "Segoe UI", sans-serif;
}

h1, h2, h3, .serif {
  font-family: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  text-wrap: balance;
}

.mono {
  font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

button {
  font-family: inherit;
}

button:focus-visible, textarea:focus-visible, .comentario-clicable:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* .panel-lateral usa su propia regla .oculto (con animación de deslizar);
   todo lo demás simplemente se oculta */
.oculto:not(.panel-lateral) { display: none; }

/* ---------- Masthead ---------- */

#masthead {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: var(--forest);
  color: var(--forest-ink);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  z-index: 1000;
  box-shadow: var(--shadow);
}

#wordmark {
  font-family: "Fraunces", serif;
  font-weight: 600;
  font-size: 19px;
  white-space: nowrap;
  letter-spacing: 0.2px;
}

#wordmark span {
  opacity: 0.72;
  font-weight: 400;
  font-style: italic;
}

#ruta {
  font-size: 14px;
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 2px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}

#ruta::-webkit-scrollbar { display: none; }

#ruta button.btn-atras {
  background: rgba(255,255,255,0.14);
  color: var(--forest-ink);
  border: 1px solid rgba(255,255,255,0.22);
  padding: 5px 11px;
  border-radius: 3px;
  cursor: pointer;
  margin-right: 12px;
  font-size: 13px;
  font-family: "Manrope", sans-serif;
  flex-shrink: 0;
}

#ruta button.btn-atras:hover { background: rgba(255,255,255,0.24); }

#ruta .separador { margin: 0 6px; opacity: 0.55; flex-shrink: 0; }

#ruta .nivel-actual, #ruta .enlace { flex-shrink: 0; }

#ruta .nivel-actual, #ruta .enlace {
  background: none;
  border: none;
  color: inherit;
  font: inherit;
  padding: 0;
  cursor: default;
}

#ruta .nivel-actual { font-weight: 600; }

#ruta .enlace {
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
  opacity: 0.82;
}

#ruta .enlace:hover { opacity: 1; }

#btn-ver-comentarios {
  margin-left: auto;
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  padding: 8px 14px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

#btn-ver-comentarios:hover { background: var(--accent-strong); }

@media (max-width: 640px) {
  #wordmark span { display: none; }
  #btn-ver-comentarios { padding: 7px 10px; font-size: 12px; }
}

/* ---------- Map ---------- */

#mapa {
  position: absolute;
  top: 56px;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-map);
}

.leaflet-container {
  background: var(--bg-map);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 42px 42px;
  font-family: "Manrope", sans-serif;
}

.leaflet-control-zoom a {
  background: var(--surface) !important;
  color: var(--ink) !important;
  border-color: var(--line) !important;
}

.leaflet-control-zoom a:hover { background: var(--surface-2) !important; }

.leaflet-control-attribution {
  background: var(--surface) !important;
  color: var(--ink-faint) !important;
}

.etiqueta-comuna, .etiqueta-barrio {
  background: transparent;
  border: none;
  box-shadow: none;
  font-family: "Manrope", sans-serif;
  font-weight: 600;
  color: var(--ink);
  text-shadow:
    -1px -1px 0 var(--bg-map), 1px -1px 0 var(--bg-map),
    -1px 1px 0 var(--bg-map), 1px 1px 0 var(--bg-map),
    0 0 6px var(--bg-map);
  white-space: nowrap;
  text-align: center;
  pointer-events: none;
}

.etiqueta-comuna { font-size: 13px; letter-spacing: 0.1px; }
.etiqueta-barrio { font-size: 11px; font-weight: 500; }

/* ---------- Side panels (field-note cards) ---------- */

.panel-lateral {
  position: fixed;
  top: 56px;
  bottom: 0;
  right: 0;
  width: 360px;
  max-width: 90vw;
  background: var(--surface);
  box-shadow: var(--shadow);
  z-index: 1000;
  padding: 22px 22px 20px;
  overflow-y: auto;
  transition: transform 0.25s ease;
  border-left: 1px solid var(--line);
}

.panel-lateral.oculto { transform: translateX(100%); }

.btn-cerrar-panel {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--ink-faint);
  line-height: 1;
}
.btn-cerrar-panel:hover { color: var(--ink); }

#panel-titulo, #panel-comuna-titulo {
  margin: 0 30px 4px 0;
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
}

.panel-meta {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

#lista-comentarios, #lista-comentarios-comuna {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}

.comentario-vacio {
  color: var(--ink-faint);
  font-style: italic;
  font-size: 14px;
}

.comentario {
  background: var(--surface-2);
  border-radius: 3px;
  padding: 11px 13px;
  position: relative;
  border: 1px solid var(--line);
}

.comentario-barrio {
  font-family: "Fraunces", serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent-strong);
  margin-bottom: 4px;
}

.comentario-fecha {
  font-size: 11px;
  color: var(--ink-faint);
  margin-bottom: 5px;
  letter-spacing: 0.3px;
}

.comentario-texto {
  font-size: 14px;
  color: var(--ink);
  white-space: pre-wrap;
  margin: 0;
  line-height: 1.45;
}

.comentario-borrar {
  position: absolute;
  top: 10px;
  right: 11px;
  background: none;
  border: none;
  color: #b0503f;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}
.comentario-borrar:hover { text-decoration: underline; }

.comentario-clicable { cursor: pointer; }
.comentario-clicable:hover { background: var(--line); }

#form-comentario {
  display: flex;
  flex-direction: column;
  gap: 9px;
  border-top: 1px solid var(--line);
  padding-top: 17px;
}

#texto-comentario {
  font-family: inherit;
  font-size: 14px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 3px;
  resize: vertical;
  background: var(--surface);
  color: var(--ink);
}

#form-comentario button {
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  padding: 11px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}
#form-comentario button:hover { background: var(--accent-strong); }
#form-comentario button:disabled { opacity: 0.6; cursor: default; }

.aviso-solo-lectura {
  font-size: 12.5px;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 10px 12px;
  line-height: 1.4;
}

.aviso-guardando {
  font-size: 12px;
  color: var(--ink-faint);
}
</style>
</head>
<body>
  <header id="masthead">
    <div id="wordmark">Atlas <span>de Pereira</span></div>
    <nav id="ruta" aria-label="Ruta"></nav>
    <button id="btn-ver-comentarios" class="oculto" type="button">Ver comentarios de la comuna</button>
  </header>

  <div id="mapa"></div>

  <aside id="panel-barrio" class="panel-lateral oculto">
    <button id="cerrar-panel" class="btn-cerrar-panel" title="Cerrar" type="button">&times;</button>
    <h2 id="panel-titulo"></h2>
    <div id="panel-meta" class="panel-meta mono"></div>

    <div id="lista-comentarios"></div>
    <div id="zona-form-comentario"></div>
  </aside>

  <aside id="panel-comuna" class="panel-lateral oculto">
    <button id="cerrar-panel-comuna" class="btn-cerrar-panel" title="Cerrar" type="button">&times;</button>
    <h2 id="panel-comuna-titulo"></h2>
    <div id="lista-comentarios-comuna"></div>
  </aside>

  <script id="datos-comentarios" type="application/json">{}</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script id="logic-script">
__LOGIC_SCRIPT__
  </script>
</body>
</html>
